name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "::error::Xcode 27 not installed on this runner image"; exit 1; fi
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Architecture check
        run: Scripts/arch-check
      - name: Build
        run: swift build
      - name: Test
        run: |
          if [ -d Tests ]; then swift test; else echo "no test targets yet"; fi
      - name: Examples
        run: |
          shopt -s nullglob
          for project in Examples/*/*.xcodeproj; do
            xcodebuild -project "$project" -scheme "$(basename "$project" .xcodeproj)" -destination 'generic/platform=iOS Simulator' build
          done
